services:
  # SQL Server en contenedor; los datos quedan en el volumen jn_bd_data
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${DB_PASSWORD:-Paw_Jueves2026}"
    ports:
      # 1433 ya lo usa el SQL Server local; desde SSMS: localhost,14330
      - "14330:1433"
    volumes:
      - jn_bd_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # 1) Restaura BD/Respaldo.sql solo si JN_BD todavia no existe.
  # 2) Despues, SIEMPRE aplica BD/Migraciones/*.sql en orden (son idempotentes).
  #    Para aplicar migraciones nuevas con la BD ya levantada: docker compose up db-init
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      MSSQL_SA_PASSWORD: "${DB_PASSWORD:-Paw_Jueves2026}"
    volumes:
      - ./BD:/scripts:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        SQLCMD="/opt/mssql-tools18/bin/sqlcmd -S db -U sa -P $$MSSQL_SA_PASSWORD -C"
        EXISTE=$$($$SQLCMD -h -1 -W -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM sys.databases WHERE name = 'JN_BD'" | tr -d '[:space:]')
        if [ "$$EXISTE" = "0" ]; then
          echo "Restaurando JN_BD desde Respaldo.sql..."
          $$SQLCMD -b -i /scripts/Respaldo.sql
        else
          echo "JN_BD ya existe, no se restaura."
        fi
        for SCRIPT in $$(ls /scripts/Migraciones/*.sql 2>/dev/null | sort); do
          echo "Aplicando migracion $$(basename $$SCRIPT)..."
          $$SQLCMD -b -i "$$SCRIPT" || exit 1
        done
        $$SQLCMD -h -1 -W -Q "SET NOCOUNT ON; SELECT 'Version del esquema: ' + CAST(MAX(Version) AS VARCHAR(10)) FROM JN_BD.dbo.SchemaVersion"
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: ./PAW_Jueves_API
      dockerfile: PAW_Jueves_API/Dockerfile
    ports:
      - "5135:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # Dentro del contenedor "localhost" no es tu PC: se usa el servicio "db" y autenticacion SQL
      Variables__ConnectionString: "Server=db,1433; Database=JN_BD; User Id=sa; Password=${DB_PASSWORD:-Paw_Jueves2026}; TrustServerCertificate=True;"
      # Link de recuperacion: apunta al puerto publicado del servicio web
      Variables__LinkForgot: "http://localhost:5051/Home/ChangePassword/"
    depends_on:
      db-init:
        condition: service_completed_successfully

  web:
    build:
      context: ./PAW_Jueves
      dockerfile: PAW_Jueves/Dockerfile
    ports:
      - "5051:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Variables__ApiBaseUrl: "http://api:8080/api/"
    volumes:
      # Llaves de Data Protection (antiforgery y sesion); sin esto se pierden al recrear el contenedor
      - web_keys:/app/App_Data/keys
    depends_on:
      - api

volumes:
  jn_bd_data:
  web_keys:
