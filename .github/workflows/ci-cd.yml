name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # CI: compila los dos proyectos en cada push y pull request
  build:
    name: Build ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project:
          - PAW_Jueves/PAW_Jueves/PAW_Jueves.csproj
          - PAW_Jueves_API/PAW_Jueves_API/PAW_Jueves_API.csproj
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ${{ matrix.project }}

      - name: Build
        run: dotnet build ${{ matrix.project }} -c Release --no-restore

  # Pruebas automaticas de la API (reglas de negocio, hash de contrasenas, token JWT)
  test:
    name: Tests API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test PAW_Jueves_API/PAW_Jueves_API.Tests/PAW_Jueves_API.Tests.csproj -c Release

  # CD: construye las imagenes Docker; solo se publican en Docker Hub con push a main
  docker:
    name: Docker ${{ matrix.image }}
    needs: [build, test]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: paw_jueves
            context: PAW_Jueves
            dockerfile: PAW_Jueves/PAW_Jueves/Dockerfile
          - image: paw_jueves_api
            context: PAW_Jueves_API
            dockerfile: PAW_Jueves_API/PAW_Jueves_API/Dockerfile
    env:
      PUSH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login a Docker Hub
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Metadata de la imagen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME || 'local' }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Build y push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
